[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disk-graph"
version = "1.0.0"
description = "A package for creating graphs on disk"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Go Khai", email = "gos.khai12@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "nox"]

[project.urls]
Homepage = "https://github.com/Goodkhau/GraphDisk"

[tool.setuptools.packages.find]
where = ["src"]