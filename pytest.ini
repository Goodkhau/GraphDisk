[pytest]
pythonpath = .
testpaths =
    tests
    src/disk_graph/db/pysqlite3/tests

addopts = -n auto -m 'not e2e'
markers = 
    e2e: end to end tests that downloads this package, runs use cases.
    integration: integration with database creation, lot of side effects and dedicated teardown
    unit: unittest mainly on pure functions, mocks are discouraged.