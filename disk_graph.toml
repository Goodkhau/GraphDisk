[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-package"          # must be unique on PyPI
version = "0.1.0"
description = "A short description"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
my-cli = "my_package.core:main"   # optional: creates a command-line tool

[project.urls]
Homepage = "https://github.com/you/my-package"